[project]
name = "sakai-mcp"
version = "0.1.0"
description = "mcp server for a student's sakai lms account: courses, assignments, files, grades, notifications, tasks and submission"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Joel Taylor", email = "jtayped@gmail.com" }
]
requires-python = ">=3.13"
keywords = ["mcp", "sakai", "lms", "model-context-protocol", "claude"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Education",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.13",
    "Topic :: Education",
]
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.3.0,<3",
]

[project.urls]
Homepage = "https://github.com/jtayped/sakai-mcp"
Issues = "https://github.com/jtayped/sakai-mcp/issues"
Changelog = "https://github.com/jtayped/sakai-mcp/blob/main/CHANGELOG.md"

[project.scripts]
sakai-mcp = "sakai_mcp.server:main"

[build-system]
requires = ["uv_build>=0.12.9,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
